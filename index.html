<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Анкеты · DSGNVIKA</title>
<meta name="description" content="Анкеты для разработки логотипа и фирменного стиля.">
<meta name="theme-color" content="#EEEDEB">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Oranienbaum&display=swap">
<style>
:root{
  --bg:#EEEDEB; --ink:#2B2A2A; --muted:#5F5C5C; --line:#CFCBC7;
  --berry:#863A60; --berry-dark:#5E2843; --berry-soft:#B65484; --tint:#F4E8EE;
  --field:rgba(255,255,255,.78);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(70px);pointer-events:none;z-index:0}
.b1{top:-60px;right:-90px;width:300px;height:300px;background:#EBC9D9;opacity:.8}
.b2{top:45%;left:-130px;width:280px;height:280px;background:#D3DEEA;opacity:.8}
.b3{bottom:-80px;right:-100px;width:260px;height:260px;background:#DCD8D4}
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:0 20px}
.top{display:flex;justify-content:space-between;padding:20px 0 14px;border-bottom:1px solid var(--line);font-size:11px;font-weight:500;letter-spacing:.22em}
.progress{padding:22px 0 0}
.progress-row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:8px}
.progress-row i{color:var(--berry)}
.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.bars span{height:3px;border-radius:2px;background:#D4D0CC;transition:background .3s}
.bars span.on{background:var(--berry)}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:.45em;color:var(--muted)}
.dash{width:32px;height:2px;background:var(--berry);margin:12px 0}
h1{margin:4px 0 0;font-family:Oranienbaum,serif;font-weight:400;font-size:40px;line-height:1.05}
h1 em,.accent{font-style:normal;color:var(--berry)}
.lead{margin:14px 0 0;font-size:15px;font-weight:300;line-height:1.5;color:var(--muted)}
.head{padding:32px 0 0}
.step{display:none}
.step.active{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.qs{display:flex;flex-direction:column;gap:34px;padding:30px 0 0}
.q{display:flex;flex-direction:column;gap:12px;border:0;margin:0;padding:0;min-width:0}
.q-title{display:flex;gap:10px;align-items:baseline;font-family:Oranienbaum,serif;font-size:23px;line-height:1.2;padding:0}
.q-title b{font-family:Inter,sans-serif;font-size:12px;font-weight:500;color:var(--berry)}
.q-title small{font-family:Inter,sans-serif;font-size:12px;font-weight:300;color:var(--muted)}
.hint{margin:0;font-size:14px;font-weight:300;line-height:1.45;color:var(--muted)}
.tip{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--berry)}
.tip:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--berry-soft);flex:none}
input[type=text],input[type=email],textarea{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--field);font:300 16px/1.5 Inter,sans-serif;color:var(--ink);outline:none;transition:border-color .2s}
input[type=text]{height:52px;padding:0 16px}
textarea{resize:vertical;min-height:96px}
input:focus,textarea:focus{border-color:var(--berry)}
::placeholder{color:#8A8686}
.box{padding:14px 16px;border-radius:12px;background:rgba(255,255,255,.55);font-size:14px;font-weight:300;line-height:1.55;color:var(--muted)}
.box p{margin:0 0 6px}
.box .ex{color:var(--ink);font-weight:400}
.box .ex span{color:var(--berry)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:999px;background:var(--field);color:var(--ink);font:400 14px Inter,sans-serif;cursor:pointer;transition:all .15s}
.chip[aria-pressed=true]{background:var(--berry);border-color:var(--berry);color:#fff}
.chip:disabled{opacity:.45;cursor:default}
.opt{display:flex;gap:12px;align-items:center;min-height:52px;padding:10px 16px;border:1px solid var(--line);border-radius:12px;background:var(--field);font-size:15px;cursor:pointer}
.opt:has(input:checked){border-color:var(--berry)}
.opt input{width:18px;height:18px;margin:0;accent-color:var(--berry);flex:none}
.sub{display:none}
.sub.show{display:block}
.counter{display:flex;justify-content:space-between;font-size:14px;font-weight:300;color:var(--muted)}
.counter b{font-weight:500;color:var(--berry)}
.own{height:48px!important;border-style:dashed!important;border-color:var(--berry-soft)!important;border-radius:999px!important;background:rgba(255,255,255,.6)!important;font-size:15px!important}
.upload{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:24px 16px;border:1.5px dashed var(--berry-soft);border-radius:14px;background:rgba(255,255,255,.6);text-align:center;cursor:pointer}
.upload input{position:absolute;inset:0;opacity:0;cursor:pointer}
.upload strong{font-size:15px;font-weight:500;color:var(--berry)}
.upload span{font-size:12px;color:var(--muted)}
.files{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink)}
.files div{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.7)}
.files button{border:0;background:none;color:var(--berry);font-size:16px;cursor:pointer;padding:0 4px}
.pack{display:flex;flex-direction:column;gap:14px;padding:22px 20px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.65);cursor:pointer;transition:all .2s}
.pack:has(input:checked){border:2px solid var(--berry);background:rgba(255,255,255,.88);box-shadow:0 10px 30px rgba(134,58,96,.10)}
.pack-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pack-name{font-family:Oranienbaum,serif;font-size:30px;line-height:1}
.pack-price{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:500;color:var(--berry)}
.pack-price input{width:20px;height:20px;margin:0;accent-color:var(--berry)}
.pack p{margin:0;font-size:15px;line-height:1.45}
.need{padding:12px 14px;border-radius:12px;background:#ECEAE7;font-size:14px;font-weight:300;line-height:1.5}
.pack:has(input:checked) .need{background:var(--tint)}
.need b{font-weight:500;color:var(--berry)}
.label{font-size:11px;font-weight:500;letter-spacing:.3em;color:var(--muted)}
.pack ul{display:flex;flex-direction:column;gap:8px;margin:0;padding:0 0 0 18px;font-size:14px;font-weight:300;line-height:1.45}
.term{padding-top:12px;border-top:1px solid #E2DEDA;font-size:14px;line-height:1.45}
.term b{font-weight:500}.term span{font-weight:300}
.kinds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kind{display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--field);cursor:pointer}
.kind:has(input:checked){border:2px solid var(--berry);padding:11px}
.kind .pic{display:flex;align-items:center;justify-content:center;gap:8px;height:86px;border-radius:10px;background:#F2F0EE}
.kind .lbl{display:flex;gap:8px;align-items:center;font-size:13px}
.kind input{width:16px;height:16px;margin:0;accent-color:var(--berry)}
.sep{display:flex;align-items:center;gap:12px}
.sep:before,.sep:after{content:"";flex:1;height:1px;background:var(--line)}
.sep span{font-size:11px;font-weight:500;letter-spacing:.3em;color:var(--muted)}
.terms{padding:14px 16px;border-radius:12px;background:var(--tint);font-size:13px;font-weight:300;line-height:1.55}
.nav{display:flex;gap:10px;padding:30px 0 0}
.btn{height:56px;padding:0 22px;border-radius:999px;font:500 15px Inter,sans-serif;letter-spacing:.04em;cursor:pointer;transition:background .2s}
.btn-ghost{border:1px solid var(--line);background:transparent;color:var(--ink);font-weight:400}
.btn-main{flex:1;border:0;background:var(--berry);color:#fff}
.btn-main:hover{background:var(--berry-dark)}
.btn-main:disabled{opacity:.6;cursor:default}
.err{display:none;margin:12px 0 0;padding:12px 14px;border-radius:12px;background:#F8E3E3;color:#8A1F1F;font-size:14px;line-height:1.45}
.err.show{display:block}
.invalid{border-color:#B3261E!important}
.foot{display:flex;justify-content:space-between;align-items:center;margin:44px 0 28px;padding-top:14px;border-top:1px solid var(--line);font-size:11px;font-weight:500;letter-spacing:.22em}
.foot i{font-weight:400;letter-spacing:.04em;color:var(--berry)}
.num{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--berry-soft);color:#fff;font-size:12px;letter-spacing:0}
.thanks{min-height:60vh;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:40px 8px}
.check{display:flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:50%;background:var(--berry)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
<style>
.cards{display:flex;flex-direction:column;gap:14px;padding:30px 0 0}
.card{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:22px 20px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.65);color:var(--ink);text-decoration:none;transition:all .2s}
.card:hover{border-color:var(--berry);background:rgba(255,255,255,.88)}
.card b{display:block;font-family:Oranienbaum,serif;font-weight:400;font-size:28px;line-height:1.1}
.card span{display:block;margin-top:6px;font-size:14px;font-weight:300;color:var(--muted)}
.card i{font-style:normal;font-size:22px;color:var(--berry)}
</style>
</head>
<body>
<div class="blob b1" aria-hidden="true"></div>
<div class="blob b2" aria-hidden="true"></div>
<div class="blob b3" aria-hidden="true"></div>
<main class="wrap">
<div class="top"><span>DSGNVIKA</span><span>LOGO · IDENTITY</span></div>
<div class="head">
  <div class="eyebrow">АНКЕТА</div>
  <div class="dash"></div>
  <h1>Что вам <em>нужно?</em></h1>
  <p class="lead">Выберите анкету — несколько вопросов о вашем бизнесе, удобно заполнять с телефона.</p>
</div>
<div class="cards">
  <a class="card" href="/logo/"><div><b>Логотип</b><span>Лайт · 9 000 ₽ или Стандарт · 16 000 ₽</span></div><i>→</i></a>
  <a class="card" href="/stil/"><div><b>Фирменный стиль</b><span>Логотип, цвета, шрифты и носители</span></div><i>→</i></a>
</div>
<div class="foot"><span>THE BRIEF · <i>choose</i></span><span class="num">00</span></div>
</main>
</body>
</html>
